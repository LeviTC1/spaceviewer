[package]
name = "spaceviewer-wgpu"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM wgpu renderer for SpaceViewer's hierarchical universe map"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
console_error_panic_hook = "0.1"
glam = { version = "0.29", features = ["bytemuck"] }
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wgpu = { version = "24.0.5", default-features = false, features = ["webgpu", "webgl", "wgsl"] }

[dependencies.web-sys]
version = "0.3.104"
features = [
  "HtmlCanvasElement",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

